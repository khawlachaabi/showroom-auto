<!-- <h1>{{title()}}</h1> -->
<app-head-bar
    [favoritesCount]="favoriteIds.length"
    [reservationsCount]="reservedCars.length"
    [onlyFavorites]="onlyFavorites"
    (onShowFavorites)="toggleOnlyFavorites()"
    (onShowCart)="openCart()"
    [darkMode]="darkMode" (onToggleTheme)="toggleTheme()"></app-head-bar>
<app-sort-filter [brands]="brands"
    (onSort)="changeSort($event)"
    (onMaxPrice)="changeMaxPrice($event)"
    (onInStock)="changeInStock($event)"
    (onBrand)="changeBrand($event)"
    (onReset)="resetFilters()"></app-sort-filter>
<!-- ajout : vus recemment (cache tant qu aucune voiture n a ete ouverte) -->
@if(recentCars.length > 0){
    <app-recent-cars [cars]="recentCars" (onSelect)="selectCar($event)"></app-recent-cars>
}
<!-- [autos] recoit maintenant la liste triee/filtree au lieu de autoList -->
<app-search-bar [autos]="displayedAutos" (onSelectCar)="selectCar($event)"
    [favoriteIds]="favoriteIds" (onToggleFavorite)="toggleFavorite($event)"
    [compareCars]="compareCars" (onToggleCompare)="toggleCompare($event)"></app-search-bar>
@if(selectedCar){
    <!-- {{selectedCar.model}} <br> -->
    <!-- reste ne ligne ici  -->
    <app-car-details [car]="selectedCar"
        [reserved]="reservedCars.includes(selectedCar)"
        (onClose)="closeDetails()"
        (onReserve)="reserveCar($event)"></app-car-details>
}

<!-- barre du comparateur en bas de l ecran -->
@if(compareCars.length > 0){
    <div class="compare-space"></div>
    <app-compare [cars]="compareCars"
        (onRemove)="toggleCompare($event)"
        (onClear)="clearCompare()"></app-compare>
}

<!-- panier des reservations -->
@if(showCart){
    <app-cart [cars]="reservedCars"
        (onCancel)="cancelReservation($event)"
        (onClose)="closeCart()"></app-cart>
}

<!-- notification temporaire -->
@if(toastMessage){
    <app-toast [message]="toastMessage"></app-toast>
}
